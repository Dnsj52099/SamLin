:root {
  --ink-black: #1c1a17;
  --ink-dark: #26221d;
  --ink-mid: #3a332a;
  --parchment: #e9dfc7;
  --parchment-dim: #d8caa3;
  --parchment-soft: #f2e9d3;
  --gold: #b6893f;
  --gold-soft: #cba55e;
  --seal-red: #8c2b25;
  --seal-red-bright: #a8352c;
  --text-dim: #a89a7c;
  --font-brush: "Ma Shan Zheng", cursive;
  --font-serif: "Noto Serif TC", "PMingLiU", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--ink-black);
  color: var(--parchment);
  font-family: var(--font-serif);
  overflow-x: hidden;
}

body {
  position: relative;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(182, 137, 63, 0.08), transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(140, 43, 37, 0.10), transparent 50%),
    linear-gradient(180deg, #171512 0%, #1c1a17 40%, #14120f 100%);
  min-height: 100vh;
}

.paper-texture {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px);
  mix-blend-mode: overlay;
}

/* ───────── 畫面切換 ───────── */

.screen {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 2;
}

.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ───────── 標題畫面 ───────── */

#screen-title {
  justify-content: center;
  padding: 6vh 1.5rem 4vh;
  text-align: center;
  gap: 0.2rem;
}

.title-seal {
  width: 3.4rem;
  height: 3.4rem;
  border-radius: 6px;
  background: linear-gradient(160deg, var(--seal-red-bright), var(--seal-red));
  color: var(--parchment-soft);
  font-family: var(--font-brush);
  font-size: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 6px 18px rgba(140,43,37,0.35);
  margin-bottom: 1.2rem;
  transform: rotate(-3deg);
}

.title-main {
  font-family: var(--font-brush);
  font-size: clamp(3rem, 12vw, 5.5rem);
  color: var(--parchment-soft);
  margin: 0;
  letter-spacing: 0.15em;
  text-shadow: 0 0 30px rgba(182,137,63,0.25), 0 2px 0 rgba(0,0,0,0.4);
}

.title-sub {
  font-size: 1rem;
  letter-spacing: 0.4em;
  color: var(--gold-soft);
  margin: 0.4rem 0 0.2rem;
}

.title-flavor {
  color: var(--text-dim);
  font-size: 0.92rem;
  margin: 0.6rem 0 2.4rem;
  letter-spacing: 0.06em;
}

.title-menu {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  width: min(320px, 82vw);
}

.title-footnote {
  position: absolute;
  bottom: 1.4rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.72rem;
  color: rgba(168,154,124,0.55);
  width: 90%;
  text-align: center;
}

/* ───────── 命名畫面 ───────── */

#screen-naming {
  justify-content: center;
  padding: 2rem;
}

.naming-box {
  width: min(360px, 88vw);
  text-align: center;
  border: 1px solid rgba(182,137,63,0.3);
  padding: 2.4rem 1.8rem;
  background: rgba(38, 34, 29, 0.6);
  border-radius: 4px;
}

.naming-title {
  font-family: var(--font-brush);
  font-size: 2rem;
  color: var(--parchment-soft);
  margin: 0 0 0.6rem;
}

.naming-desc {
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-bottom: 1.4rem;
  line-height: 1.7;
}

#name-input {
  width: 100%;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(182,137,63,0.4);
  color: var(--parchment-soft);
  font-family: var(--font-serif);
  font-size: 1.05rem;
  padding: 0.7rem 0.9rem;
  text-align: center;
  border-radius: 3px;
  margin-bottom: 1.4rem;
  letter-spacing: 0.1em;
}
#name-input::placeholder { color: rgba(168,154,124,0.5); }
#name-input:focus { outline: none; border-color: var(--gold-soft); }

/* ───────── 按鈕 ───────── */

.btn {
  cursor: pointer;
  font-family: var(--font-serif);
  border: 1px solid var(--gold);
  background: linear-gradient(160deg, rgba(182,137,63,0.16), rgba(182,137,63,0.05));
  color: var(--parchment-soft);
  padding: 0.75rem 1.2rem;
  font-size: 0.98rem;
  letter-spacing: 0.12em;
  border-radius: 3px;
  transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
}
.btn:hover {

const WORLDVIEW_TEXT = `此界，大體與正史三國同軌：黃巾之亂、群雄逐鹿、赤壁一戰、三分天下——時序興衰，並無二致。

唯有一事迥異：史書留白處，這一世竟俱成真——劉備與諸葛亮、孫權與周瑜、曹操與荀彧、曹丕與曹植……那些後人於字裡行間反覆猜測、演繹的深情，在此界俱是明明白白的情之所鍾，朝野或心照不宣，或難以啟齒，卻無人能夠否認。

門第婚配，卻仍照著禮法舊制走——黃月英之於諸葛亮、孫尚香之於劉備、小喬之於周瑜、甄宓之於曹丕，多是各家各族的體面婚事，各自的深情另有所屬。這些女子心裡都透亮，也不去計較那些虛情假意，真正牽掛的，反倒是彼此——義結金蘭也好，惺惺相惜也罷，深閨之外，另有一個只屬於女子們的天下。

而妳，一介現代女子，因一部讀了一半的同人小說，陰差陽錯墜入此界，落於蜀地邊境。書中因果，妳只記得七零八落——但這個只屬於女子們的天下，妳倒也算半只腳，踏了進去。

（本站為虛構同人創作，人物取材自史書與通俗演義，情節純屬藝術想像，如有冒犯歷史觀感之處，還望見諒。）`;

/* 夢入蜀山 — 前端引擎 */

const SAVE_KEY = "mrss_save_v1";

const state = {
  name: "",
  zhao: 0,
  zhuge: 0,
  zhaoArc: 0,
  zhugeArc: 0,
  currentNode: "p1",
};

const el = {
  screens: {
    title: document.getElementById("screen-title"),
    naming: document.getElementById("screen-naming"),
    story: document.getElementById("screen-story"),
  },
  stage: document.getElementById("stage"),
  speaker: document.getElementById("speaker-name"),
  text: document.getElementById("story-text"),
  choices: document.getElementById("choices"),
  continueBtn: document.getElementById("continue-btn"),
  nameInput: document.getElementById("name-input"),
  overlay: document.getElementById("overlay"),
  overlayBody: document.getElementById("overlay-body"),
  overlayTitle: document.getElementById("overlay-title"),
  btnContinueSave: document.getElementById("btn-continue-save"),
};

function showScreen(key) {
  Object.values(el.screens).forEach((s) => s.classList.remove("active"));
  el.screens[key].classList.add("active");
}

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try {
    Object.assign(state, JSON.parse(raw));
    return true;
  } catch (e) {
    return false;
  }
}

function resolveText(node) {
  const raw = typeof node.text === "function" ? node.text(state) : node.text;
  return withName(raw, state);
}

function setStageBg(bgClass) {
  el.stage.className = "stage " + (bgClass || "scene-void");
}

function renderNode(nodeId) {
  const node = STORY[nodeId];
  if (!node) return;
  state.currentNode = nodeId;
  saveGame();

  setStageBg(node.bg);

  if (node.speaker) {
    el.speaker.textContent = node.speaker;
    el.speaker.style.display = "inline-block";
  } else {
    el.speaker.style.display = "none";
  }

  el.text.innerHTML = "";
  const paragraphs = resolveText(node).split(/\n\n+/);
  paragraphs.forEach((p) => {
    const pEl = document.createElement("p");
    pEl.textContent = p;
    el.text.appendChild(pEl);
  });

  el.choices.innerHTML = "";
  el.continueBtn.style.display = "none";

  if (node.end) {
    const btnRow = document.createElement("div");
    btnRow.className = "end-row";

    const hubBtn = document.createElement("button");
    hubBtn.className = "btn choice-btn";
    hubBtn.textContent = "◀ 返回岔路口";
    hubBtn.onclick = () => renderNode("hub_1");
    btnRow.appendChild(hubBtn);

    const titleBtn = document.createElement("button");
    titleBtn.className = "btn choice-btn ghost";
    titleBtn.textContent = "回到標題";
    titleBtn.onclick = () => showScreen("title");
    btnRow.appendChild(titleBtn);

    el.choices.appendChild(btnRow);
    return;
  }

  const resolvedChoices =
    typeof node.choices === "function" ? node.choices(state) : node.choices;

  if (resolvedChoices && resolvedChoices.length) {
    resolvedChoices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "btn choice-btn";
      btn.textContent = choice.label;
      btn.onclick = () => {
        if (choice.effect) choice.effect(state);
        if (choice.special) {
          openOverlay(choice.special);
          return;
        }
        renderNode(choice.next);
      };
      el.choices.appendChild(btn);
    });
  } else if (node.next) {
    el.continueBtn.style.display = "inline-block";
    el.continueBtn.onclick = () => renderNode(node.next);
  }
}

/* ───────── 疊層：人物誌 / 世界觀 ───────── */

function openOverlay(kind) {
  el.overlay.classList.add("active");
  if (kind === "codex") {
    el.overlayTitle.textContent = "人物誌";
    el.overlayBody.innerHTML = "";
    CODEX.forEach((group) => {
      const h = document.createElement("h3");
      h.className = "codex-faction";
      h.textContent = "── " + group.faction + " ──";
      el.overlayBody.appendChild(h);

      group.entries.forEach((person) => {
        const card = document.createElement("div");
        card.className = "codex-card";
        card.innerHTML = `
          <div class="codex-card-head">
            <span class="codex-name">${person.name}</span>
            <span class="codex-status${person.status === "已故" ? " status-dead" : ""}">${person.status}</span>
          </div>
          <div class="codex-title">${person.title}</div>
          <p class="codex-desc">${person.desc}</p>
        `;
        el.overlayBody.appendChild(card);
      });
    });
  } else if (kind === "worldview") {
    el.overlayTitle.textContent = "世界觀";
    el.overlayBody.innerHTML = "";
    WORLDVIEW_TEXT.split(/\n\n+/).forEach((p) => {
      const pEl = document.createElement("p");
      pEl.textContent = p;
      pEl.className = "worldview-p";
      el.overlayBody.appendChild(pEl);
    });
  }
}

function closeOverlay() {
  el.overlay.classList.remove("active");
  if (state.currentNode) renderNode(state.currentNode);
}

/* ───────── 啟動流程 ───────── */

document.getElementById("btn-new-game").addEventListener("click", () => {
  showScreen("naming");
});

document.getElementById("btn-confirm-name").addEventListener("click", () => {
  const val = el.nameInput.value.trim();
  state.name = val || "沈知微";
  state.zhao = 0;
  state.zhuge = 0;
  state.zhaoArc = 0;
  state.zhugeArc = 0;
  showScreen("story");
  renderNode("p1");
});

el.btnContinueSave.addEventListener("click", () => {
  if (loadGame()) {
    showScreen("story");
    renderNode(state.currentNode);
  }
});

document.getElementById("overlay-close").addEventListener("click", closeOverlay);
el.overlay.addEventListener("click", (e) => {
  if (e.target === el.overlay) closeOverlay();
});

document.getElementById("btn-codex-title").addEventListener("click", () => openOverlay("codex"));
document.getElementById("btn-worldview-title").addEventListener("click", () => openOverlay("worldview"));

document.getElementById("btn-menu").addEventListener("click", () => {
  const menu = document.getElementById("in-game-menu");
  menu.classList.toggle("active");
});
document.getElementById("btn-menu-codex").addEventListener("click", () => openOverlay("codex"));
document.getElementById("btn-menu-worldview").addEventListener("click", () => openOverlay("worldview"));
document.getElementById("btn-menu-title").addEventListener("click", () => {
  document.getElementById("in-game-menu").classList.remove("active");
  showScreen("title");
});

/* 若存在存檔，標題頁顯示「續上回」 */
window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem(SAVE_KEY)) {
    el.btnContinueSave.style.display = "inline-block";
  }
});

</script>
